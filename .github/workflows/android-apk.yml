name: android-apk

# Builds a debug APK on a standard Android runner and publishes it as an artifact.
# Kept separate from ci.yml so a lint/unit-test failure cannot block getting an
# installable build for manual testing.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/libs.versions.toml

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: 编译 assembleDebug
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android :app:assembleDebug --console=plain

      - name: 单元测试
        run: ./android/gradlew -p android :app:testDebugUnitTest --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: bilight-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
